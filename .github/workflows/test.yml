name: test

on:
  pull_request:
    types: [opened, synchronize]

  push:
    branches: [main]

  workflow_dispatch:

  # Called by update-formula.yml after it bumps the formula: a push made with the
  # workflow's GITHUB_TOKEN does not trigger the push event above.
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to test (defaults to the triggering ref)
        type: string
        required: false
        default: ""

# Note: all jobs in this workflow run on GitHub-hosted runners.
# None of them need authenticated (token) access to the repository.
#
# If this were to change and they do need authenticated access, make sure to use the
# self-hosted runners listed on the "Settings" -> "Actions" -> "Runners" page.
#
jobs:
  install:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure Git
        uses: Homebrew/actions/git-user-config@main

      # This action automatically installs the locally checked out tap.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check the CLI formula
        run: |
          brew style copsctl

      - name: Install CLI
        run: |
          brew install copsctl

      - name: Run CLI
        run: |
          copsctl --version